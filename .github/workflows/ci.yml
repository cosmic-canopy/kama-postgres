# CI for @kama/postgres. Copied in shape from @kama/sodium's workflow.
#
# Two jobs:
#   - unit: tools/test.sh, the hermetic program, debug and release, on linux-x64 and macos-arm64.
#   - integration: a real PostgreSQL per matrix entry via tools/pg.sh (docker on the Linux runner; macOS
#     runners have no container runtime). `tools/pg.sh smoke` first, one login per auth method with the
#     server's own psql, so a misconfigured server fails apart from a wrong client; then
#     tools/test-integration.sh: the integration suite, debug and release, and once more over TLS.
#     19 is a beta, so it may fail without failing the run.
# @kama/tls comes from the registry, pinned by kama.lock. The test PKI needs OpenSSL 3, which the Linux image
# has and macOS has through Homebrew rather than as /usr/bin/openssl.
# Windows is not in the matrix; the package has never been built there.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-14, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Pinned rather than `latest`, so a compiler release cannot turn this repository red without a commit.
      # Raise it deliberately, in the same commit that raises the manifests' "kama" floor.
      - name: Install kama
        env:
          KAMA_VERSION: v0.9.520
        run: |
          curl -fsSL https://kama-lang.org/install.sh | sh
          echo "$HOME/.kama/bin" >> "$GITHUB_PATH"

      - name: OpenSSL 3 for the test PKI
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"

      - name: Version
        run: |
          kama --version
          "${OPENSSL:-openssl}" version

      - name: Unit tests
        run: tools/test.sh

  integration:
    name: integration (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.pg == '19' }}
    strategy:
      fail-fast: false
      matrix:
        pg: ['14', '15', '16', '17', '18', '19']
    env:
      CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@v5

      - name: Install kama
        env:
          KAMA_VERSION: v0.9.520
        run: |
          curl -fsSL https://kama-lang.org/install.sh | sh
          echo "$HOME/.kama/bin" >> "$GITHUB_PATH"

      - name: Start PostgreSQL ${{ matrix.pg }}
        run: tools/pg.sh up --version ${{ matrix.pg }}

      - name: Server smoke (one login per auth method)
        run: tools/pg.sh smoke --version ${{ matrix.pg }}

      - name: Integration tests (debug, release, and release over TLS)
        run: tools/test-integration.sh --version ${{ matrix.pg }}

      - name: Server log on failure
        if: failure()
        run: tools/pg.sh logs --version ${{ matrix.pg }} || true

      - name: Stop PostgreSQL
        if: always()
        run: tools/pg.sh down --version ${{ matrix.pg }}
