# pg_hba.conf for the integration server (tools/pg.sh). One role per authentication method, so a test
# picks the method by picking the user. First match wins, so the specific lines come before the catch-alls.
#
# TYPE      DATABASE  USER          ADDRESS   METHOD
local       all       kp_trust                trust
local       all       kp_scram                scram-sha-256
local       all       all                     trust            # the container's own psql and pg_isready

host        all       kp_trust      all       trust
host        all       kp_password   all       password         # cleartext password (over TLS or not)
host        all       kp_md5        all       md5              # stored as md5, so the server asks for md5
host        all       kp_md5_scram  all       md5              # stored as SCRAM, so md5 runs SCRAM
host        all       kp_scram      all       scram-sha-256
host        all       kp_saslprep   all       scram-sha-256    # a password SASLprep changes
hostssl     all       kp_cert       all       cert             # client certificate, CN must be kp_cert
hostssl     all       kp_ssl_only   all       scram-sha-256    # refused without TLS
hostnossl   all       kp_nossl      all       scram-sha-256    # refused WITH TLS
host        all       postgres      all       scram-sha-256
