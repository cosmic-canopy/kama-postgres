# Appended to the container's postgresql.conf by initdb/00-setup.sh. Takes effect when the image's
# entrypoint restarts the server after initialisation.
listen_addresses = '*'
ssl = on
ssl_cert_file = 'server.crt'
ssl_key_file = 'server.key'
ssl_ca_file = 'ca.crt'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = 'scram-sha-256'
max_connections = 200
log_connections = on
log_min_messages = warning
